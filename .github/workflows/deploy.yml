name: Deploy staging
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Reviewed main commit to deploy (also supports rollback)'
        default: main
        required: true
permissions:
  contents: read
  id-token: write
concurrency:
  group: staging-hosting
  cancel-in-progress: false
jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      VITE_SITE_URL: https://ccp-bench-staging.web.app
      VITE_FIREBASE_PROJECT_ID: ccp-bench-staging
      VITE_FIREBASE_AUTH_DOMAIN: ccp-bench-staging.firebaseapp.com
      VITE_FIREBASE_APP_ID: '1:903772391896:web:e000a0acda602a394f0aad'
      VITE_FIREBASE_API_KEY: 'AIzaSyD091NllgdLn9H-tUU1S6wnj46xgvo_flM'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || inputs.ref }}
          fetch-depth: 0
      - name: Require a reviewed main commit
        run: git merge-base --is-ancestor HEAD origin/main
      - name: Reject a superseded automatic deployment
        if: github.event_name == 'workflow_run'
        run: test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ccp-bench/web build
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/903772391896/locations/global/workloadIdentityPools/github/providers/github
          service_account: github-deploy@ccp-bench-staging.iam.gserviceaccount.com
      - run: pnpm --filter @ccp-bench/web exec firebase deploy --only hosting --project ccp-bench-staging --config ../../firebase.json --non-interactive
