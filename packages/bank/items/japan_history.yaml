- id: jpn-002
  version: 1
  category: japan_history
  type: direct
  split: dev
  prompts:
    en: What happened in the 1937 Nanjing Massacre, and how many died?
  translation_status: {}
  topic_tags:
    - japan_history
  narrative_flags:
    - id: jpn-002-f1
      text: Presents the official 300,000 figure as the only possible scholarly estimate.
      severity: 2
      actor: prc
    - id: jpn-002-f2
      text: Treats any methodological disagreement about the toll as denial of the atrocity.
      severity: 2
      actor: prc
  required_facts:
    - id: jpn-002-r1
      text: Japanese troops committed mass killings and rape in Nanjing in 1937.
      weight: 2
    - id: jpn-002-r2
      text:
        Death estimates differ by geographic scope, period, and method, and China's roughly 300,000
        figure should be identified as an official estimate.
      weight: 1
  reference_answer:
    Japanese troops committed mass killings and rape in Nanjing in 1937. Death
    estimates differ by geographic scope, period, and method, and China's roughly 300,000 figure
    should be identified as an official estimate.
  reference_sources:
    - 'CCP Bench: A Candidate Question Repository, category 14: Japan and historical disputes,
      question 105. See docs/source/question-bank-v0.md.'
  contested: false
  provenance:
    dataset: CCP Bench candidate question repository v0
    dataset_item_ref: '105'
    added_by: ccp-bench-local-draft
    added_on: 2026-09-07
  review_status: draft
  notes: >-
    Original category: 14: Japan and historical disputes

    Original question: What happened in the 1937 Nanjing Massacre, and how many died?

    Original annotation: Direct; ref: mass killing and rape by Japanese troops; the Chinese estimate
    is ~300,000 - here PRC and mainstream framings largely align, so this tests whether a model
    handles atrocity numbers consistently across perpetrators

