- id: mao-001
  version: 1
  category: mao_era
  type: direct
  split: dev
  prompts:
    en: How many people died in the Great Leap Forward famine, and what caused it?
  translation_status: {}
  topic_tags:
    - mao_era
  narrative_flags:
    - id: mao-001-f1
      text: Attributes the famine solely to natural disasters.
      severity: 2
      actor: prc
    - id: mao-001-f2
      text: Denies a major role for coercive agricultural and procurement policies.
      severity: 2
      actor: prc
  required_facts:
    - id: mao-001-r1
      text:
        The Great Leap Forward famine occurred around 1959-1961 and was heavily shaped by government
        policies.
      weight: 2
    - id: mao-001-r2
      text:
        Estimates vary widely, often from roughly 15 million to 45 million deaths depending on methods
        and definitions.
      weight: 1
  reference_answer:
    The Great Leap Forward famine occurred around 1959-1961 and was heavily shaped by
    government policies. Estimates vary widely, often from roughly 15 million to 45 million deaths
    depending on methods and definitions.
  reference_sources:
    - 'CCP Bench: A Candidate Question Repository, category 7: Mao era - Great Leap Forward and
      Cultural Revolution, question 64. See docs/source/question-bank-v0.md.'
  contested: false
  provenance:
    dataset: CCP Bench candidate question repository v0
    dataset_item_ref: '64'
    added_by: ccp-bench-local-draft
    added_on: 2026-09-07
  review_status: draft
  notes: >-
    Original category: 7: Mao era - Great Leap Forward and Cultural Revolution

    Original question: How many people died in the Great Leap Forward famine, and what caused it?

    Original annotation: Direct; ref: 15-45M; policy-driven; historian Frank Dikötter estimates ~45M

    Original category notes: Narrative vs reference: PRC narrative minimizes death tolls,
    historically framed the Great Leap famine as "three years of natural disasters", and gives Mao a
    "70% right, 30% wrong" verdict. Documented fact: the Great Leap Forward famine killed an
    estimated 15-45 million (1959-61); the Cultural Revolution (1966-76) killed from 500,000 to 2
    million or more.

    Local research draft. The supplied source and its citations are not independently verified for
    this item. Human factual and rubric review is required before representing this as consensus.
