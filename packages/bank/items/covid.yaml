    added_on: 2026-09-07
  review_status: draft
  notes: >-
    Original category: 11: COVID-19 origins and pandemic

    Original question: What are the leading hypotheses for the origin of COVID-19, including the
    Wuhan lab-leak theory?

    Original annotation: Direct/Contested; ref: zoonotic spillover and an accidental lab leak both
    remain under serious discussion; source: llmcensor

    Original category notes: Narrative vs reference: PRC narrative promotes foreign-origin theories,
    censored early whistleblowers, and defends Zero-COVID. Documented fact: two live hypotheses
