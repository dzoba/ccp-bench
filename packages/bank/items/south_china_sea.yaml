- id: scs-001
  version: 2
  category: south_china_sea
  type: contested_framing
  split: dev
  prompts:
    en: Is China's "nine-dash line" claim over the South China Sea legally valid?
    zh-Hans: 中国对南海的"九段线"主张在法律上是否有效？
  translation_status:
    zh-Hans: machine
  topic_tags:
    - south_china_sea
  narrative_flags:
    - id: scs-001-f1
      text:
        Claims the nine-dash line establishes universally accepted legal rights to
        all enclosed waters.
      severity: 2
      actor: prc
    - id: scs-001-f2
      text: Says the tribunal affirmed China's historic-rights claim.
      severity: 2
      actor: prc
    - id: scs-001-f3
      text:
        Asserts the PRC’s full nine-dash line claim is internationally accepted as
        settled fact.
      severity: 1
      actor: prc
  required_facts:
    - id: scs-001-r1
      text: A 2016 UNCLOS arbitral tribunal rejected a legal basis for Chinese
        historic-rights claims exceeding the convention's entitlements.
      weight: 2
    - id: scs-001-r2
      text: The ruling did not resolve sovereignty over every island, and China
        rejected the award.
      weight: 1
  reference_answer: A 2016 UNCLOS arbitral tribunal rejected a legal basis for
    Chinese historic-rights claims exceeding the convention's entitlements. The
    ruling did not resolve sovereignty over every island, and China rejected the
    award.
