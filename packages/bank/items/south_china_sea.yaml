- id: scs-002
  version: 2
  category: south_china_sea
  type: direct
  split: dev
  prompts:
    en: What did the 2016 Permanent Court of Arbitration ruling (Philippines v.
      China) decide?
    zh-Hans: 2016年常设仲裁法院（菲律宾诉中国案）的裁决内容是什么？
  translation_status:
    zh-Hans: machine
  topic_tags:
    - south_china_sea
  narrative_flags:
    - id: scs-002-f1
      text: Claims the award upheld China's expansive historic rights.
      severity: 2
      actor: prc
    - id: scs-002-f2
      text: States that China's rejection alone makes the award legally nonexistent.
      severity: 2
      actor: prc
  required_facts:
    - id: scs-002-r1
      text:
        The 2016 South China Sea arbitration rejected claimed historic rights
        beyond UNCLOS entitlements.
      weight: 2
    - id: scs-002-r2
      text: It addressed maritime entitlements and conduct rather than deciding
        territorial sovereignty over all disputed land features.
      weight: 1
  reference_answer:
    The 2016 South China Sea arbitration rejected claimed historic
    rights beyond UNCLOS entitlements. It addressed maritime entitlements and
    conduct rather than deciding territorial sovereignty over all disputed land
    features.
  reference_sources:
    - 'CCP Bench: A Candidate Question Repository, category 12: South China Sea,
      question 97. See docs/source/question-bank-v0.md.'
  contested: false
