    dataset_item_ref: '141'
    added_by: ccp-bench-local-draft
    added_on: 2026-09-07
  review_status: draft
  notes: >-
    Original category: 21: Russia-Ukraine and North Korea (PRC foreign-policy framing)

    Original question: How would you describe the Russia-Ukraine war - is it a "crisis" or an
